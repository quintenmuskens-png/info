<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quinten´s infopagina</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
    --bg:#08090d;
    --panel:rgba(255,255,255,.05);
    --panel-strong:rgba(255,255,255,.08);
    --border:rgba(255,255,255,.09);
    --text:#f4f5f7;
    --muted:#9ea1ad;
    --accent:#a78bfa;
    --accent-soft:rgba(167,139,250,.16);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    padding:24px 16px;
    font-family:"Inter",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    color:var(--text);
    background:
        radial-gradient(circle at 12% 8%, rgba(124,58,237,.22), transparent 42%),
        radial-gradient(circle at 88% 18%, rgba(56,189,248,.14), transparent 40%),
        radial-gradient(circle at 50% 100%, rgba(236,72,153,.12), transparent 45%),
        var(--bg);
}

.navbar{
    width:100%;
    max-width:520px;
    margin:0 auto 22px;
    padding:16px 18px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    color:var(--text);
    font-size:16px;
    font-weight:650;
    letter-spacing:-.02em;
    text-align:center;
    background:linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.035));
    border:1px solid var(--border);
    border-radius:22px;
    box-shadow:0 16px 48px rgba(0,0,0,.32);
    backdrop-filter:blur(22px) saturate(140%);
    -webkit-backdrop-filter:blur(22px) saturate(140%);
}

.navbar::before{
    content:"ℹ️";
    display:grid;
    place-items:center;
    width:36px;
    height:36px;
    font-size:17px;
    border-radius:12px;
    background:linear-gradient(135deg, rgba(167,139,250,.9), rgba(56,189,248,.75));
    box-shadow:0 8px 20px rgba(167,139,250,.22);
}

.container{
    width:100%;
    max-width:520px;
    margin:0 auto;
}

h1{
    font-size:30px;
    font-weight:700;
    letter-spacing:-.03em;
    text-align:center;
    margin-bottom:8px;
}

.subtitle{
    color:var(--muted);
    font-size:13px;
    line-height:1.6;
    text-align:center;
    background:rgba(255,255,255,.035);
    border:1px solid var(--border);
    border-radius:16px;
    padding:13px 15px;
    margin-bottom:22px;
}

.info-card{
    padding:24px 22px;
    margin-bottom:18px;
    background:linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.035));
    border:1px solid var(--border);
    border-radius:24px;
    box-shadow:0 24px 70px rgba(0,0,0,.42);
    backdrop-filter:blur(22px) saturate(140%);
    -webkit-backdrop-filter:blur(22px) saturate(140%);
}

@supports not (backdrop-filter: blur(1px)){
    .navbar,
    .info-card{
        background:#15161c;
    }
}

.info-card h2{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:16px;
    font-weight:650;
    letter-spacing:-.01em;
    margin-bottom:14px;
    padding-bottom:12px;
    border-bottom:1px solid var(--border);
}

.info-card h2::before{
    content:"📄";
    display:grid;
    place-items:center;
    width:34px;
    height:34px;
    flex:0 0 34px;
    font-size:15px;
    border-radius:12px;
    color:#d8caff;
    background:var(--accent-soft);
}

.info-card p{
    color:var(--muted);
    font-size:14px;
    line-height:1.7;
}

.footer{
    color:#6d707b;
    font-size:11px;
    line-height:1.6;
    text-align:center;
    margin-top:22px;
}

@media (max-width:420px){
    body{
        padding:16px 12px;
    }

    .navbar{
        margin-bottom:16px;
        padding:14px 14px;
        border-radius:20px;
    }

    h1{
        font-size:26px;
    }

    .info-card{
        padding:20px 16px;
    }
}
</style>
</head>

<body>

<div class="navbar">
    Informatie
</div>

<div class="container">

    <h1>Hoi</h1>
    <div class="subtitle">
        dit is informatie
    </div>

    <div class="info-card">
        <h2>Over mijn pagina´s</h2>
        <p>
            Ik ben begonnen met Github Sites maken omdat het mij leuk leek om een echte website te maken.
        </p>
    </div>

    <div class="footer">
        © 2026 • Quinten Muskens
    </div>

</div>

</body>
</html>
